name: Offline repository checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test evaluation code and repository integrity
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Parse every Python source file
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf8')) for p in pathlib.Path('.').rglob('*.py')]"
